<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e5ff', 200: '#c7cdfe',
                            300: '#a5adf8', 400: '#828fff', 500: '#5e6ad2',
                            600: '#4f5abc', 700: '#3f48a0', 800: '#2f3580', 900: '#1e2260'
                        },
                        surface: {
                            0: '#fafbfc',
                            1: '#ffffff',
                            2: '#f4f5f7',
                            3: '#ebedf0',
                        },
                        ink: {
                            DEFAULT: '#1a1a2e',
                            muted: '#4a4a68',
                            subtle: '#8a8f98',
                            tertiary: '#b0b4bc',
                        },
                        hairline: {
                            DEFAULT: '#e4e7eb',
                            strong: '#d0d4db',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .fade-in-up { animation: fadeInUp 0.4s ease-out; }
        .slide-in-right { animation: slideInRight 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
        .pulse-dot { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.8s linear infinite; }
        .glass { background: rgba(255,255,255,0.08); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.12); }
        .input-focus { transition: all 0.2s ease; }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(94,106,210,0.15); }
        .btn-primary { transition: all 0.2s ease; }
        .btn-primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(94,106,210,0.3); }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }
        .table-row-hover { transition: background-color 0.15s ease; }
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Token management
        const TokenStore = {
            get: () => localStorage.getItem('lm_admin_token'),
            set: (token) => localStorage.setItem('lm_admin_token', token),
            clear: () => localStorage.removeItem('lm_admin_token'),
        };

        // API Helper with JWT auth
        const API_BASE = '/api/v1/admin';
        const api = {
            _headers() {
                const h = { 'Content-Type': 'application/json' };
                const token = TokenStore.get();
                if (token) h['Authorization'] = `Bearer ${token}`;
                return h;
            },
            async get(path) {
                const res = await fetch(`${API_BASE}${path}`, { headers: this._headers() });
                if (res.status === 401) { TokenStore.clear(); window.location.reload(); throw new Error('Session expired'); }
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            async post(path, body) {
                const res = await fetch(`${API_BASE}${path}`, {
                    method: 'POST',
                    headers: this._headers(),
                    body: JSON.stringify(body),
                });
                if (res.status === 401) { TokenStore.clear(); window.location.reload(); throw new Error('Session expired'); }
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            async patch(path, body) {
                const res = await fetch(`${API_BASE}${path}`, {
                    method: 'PATCH',
                    headers: this._headers(),
                    body: JSON.stringify(body),
                });
                if (res.status === 401) { TokenStore.clear(); window.location.reload(); throw new Error('Session expired'); }
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
            async delete(path) {
                const res = await fetch(`${API_BASE}${path}`, { method: 'DELETE', headers: this._headers() });
                if (res.status === 401) { TokenStore.clear(); window.location.reload(); throw new Error('Session expired'); }
                if (!res.ok) throw new Error(await res.text());
                return res.json();
            },
        };

        // Spinner component
        function Spinner({ size = 'w-4 h-4', color = 'text-white' }) {
            return (
                <svg className={`spinner ${size} ${color}`} fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            );
        }

        // Login Page (handles both setup and login)
        function LoginPage({ onLogin }) {
            const [mode, setMode] = useState('loading'); // loading, setup, login
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [passwordConfirm, setPasswordConfirm] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                fetch(`${API_BASE}/auth/setup-status`)
                    .then(r => r.json())
                    .then(d => setMode(d.setup_required ? 'setup' : 'login'))
                    .catch(() => setMode('login'));
            }, []);

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Login failed');
                    TokenStore.set(data.access_token);
                    onLogin(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleSetup = async (e) => {
                e.preventDefault();
                setError('');
                if (password !== passwordConfirm) { setError('Passwords do not match'); return; }
                if (password.length < 8) { setError('Password must be at least 8 characters'); return; }
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/auth/setup`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password, password_confirm: passwordConfirm }),
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Setup failed');
                    TokenStore.set(data.access_token);
                    onLogin(data);
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            if (mode === 'loading') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-brand-900 to-slate-900">
                        <Spinner size="w-6 h-6" color="text-brand-400" />
                    </div>
                );
            }

            const isSetup = mode === 'setup';

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-brand-900 to-slate-900 relative overflow-hidden">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute -top-40 -right-40 w-80 h-80 bg-brand-500/10 rounded-full blur-3xl"></div>
                        <div className="absolute -bottom-40 -left-40 w-80 h-80 bg-brand-400/5 rounded-full blur-3xl"></div>
                    </div>

                    <div className="w-full max-w-md relative z-10 fade-in-up">
                        <div className="bg-white rounded-2xl shadow-2xl p-8 border border-gray-100">
                            <div className="text-center mb-8">
                                <div className="w-14 h-14 bg-gradient-to-br from-brand-500 to-brand-700 rounded-xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-brand-500/20">
                                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                                </div>
                                <h1 className="text-2xl font-bold text-ink tracking-tight">License Manager</h1>
                                <p className="text-sm text-ink-subtle mt-1.5">
                                    {isSetup ? 'Create your admin account to get started' : 'Sign in to manage licenses'}
                                </p>
                                {isSetup && (
                                    <div className="mt-3 px-3 py-2 bg-brand-50 border border-brand-200 rounded-lg text-xs text-brand-700 font-medium">
                                        First-time setup — create your admin credentials
                                    </div>
                                )}
                            </div>

                            <form onSubmit={isSetup ? handleSetup : handleLogin} className="space-y-5">
                                {error && (
                                    <div className="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm flex items-center gap-2 fade-in">
                                        <Icons.X />
                                        <span>{error}</span>
                                    </div>
                                )}
                                <div>
                                    <label className="block text-sm font-medium text-ink mb-1.5">Email</label>
                                    <input type="email" value={email} onChange={e => setEmail(e.target.value)}
                                        className="w-full px-4 py-2.5 border border-hairline rounded-lg input-focus focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none text-ink placeholder:text-ink-tertiary"
                                        placeholder="admin@company.com" required autoFocus />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-ink mb-1.5">
                                        {isSetup ? 'Create Password' : 'Password'}
                                    </label>
                                    <div className="relative">
                                        <input type={showPassword ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)}
                                            className="w-full px-4 py-2.5 pr-10 border border-hairline rounded-lg input-focus focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none text-ink placeholder:text-ink-tertiary"
                                            placeholder={isSetup ? 'Min 8 characters' : 'Enter password'} required minLength={isSetup ? 8 : 1} />
                                        <button type="button" onClick={() => setShowPassword(!showPassword)}
                                            className="absolute right-3 top-1/2 -translate-y-1/2 text-ink-subtle hover:text-ink transition-colors">
                                            {showPassword ? (
                                                <svg className="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>
                                            ) : (
                                                <svg className="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                            )}
                                        </button>
                                    </div>
                                </div>
                                {isSetup && (
                                    <div>
                                        <label className="block text-sm font-medium text-ink mb-1.5">Confirm Password</label>
                                        <input type="password" value={passwordConfirm} onChange={e => setPasswordConfirm(e.target.value)}
                                            className="w-full px-4 py-2.5 border border-hairline rounded-lg input-focus focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none text-ink placeholder:text-ink-tertiary"
                                            placeholder="Re-enter password" required />
                                    </div>
                                )}
                                <button type="submit" disabled={loading}
                                    className="w-full bg-brand-500 hover:bg-brand-600 text-white font-medium py-2.5 rounded-lg btn-primary disabled:opacity-50 flex items-center justify-center gap-2">
                                    {loading ? <><Spinner /> {isSetup ? 'Creating account...' : 'Signing in...'}</> : (isSetup ? 'Create Account & Sign In' : 'Sign In')}
                                </button>
                            </form>
                        </div>
                        <p className="text-center text-gray-400 text-xs mt-5 tracking-wide">LICENSE MANAGER v2.0</p>
                    </div>
                </div>
            );
        }

        // Icons (inline SVG)
        const Icons = {
            Key: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>,
            Dashboard: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>,
            Monitor: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
            Activity: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
            Plus: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M12 4v16m8-8H4" /></svg>,
            Copy: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Check: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M5 13l4 4L19 7" /></svg>,
            X: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M6 18L18 6M6 6l12 12" /></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Settings: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
        };

        // Toast notification — refined
        function Toast({ message, type, onClose }) {
            useEffect(() => { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }, []);
            const styles = {
                success: 'bg-white border-emerald-200 text-emerald-700',
                error: 'bg-white border-red-200 text-red-700',
                info: 'bg-white border-brand-200 text-brand-700',
            };
            const icons = {
                success: <span className="w-5 h-5 rounded-full bg-emerald-100 flex items-center justify-center flex-shrink-0"><Icons.Check /></span>,
                error: <span className="w-5 h-5 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0"><Icons.X /></span>,
                info: <span className="w-5 h-5 rounded-full bg-brand-100 flex items-center justify-center flex-shrink-0"><Icons.Check /></span>,
            };
            return (
                <div className={`fixed top-4 right-4 ${styles[type]} border px-4 py-3 rounded-xl shadow-lg z-50 fade-in-up flex items-center gap-2.5 max-w-sm`}>
                    {icons[type]}
                    <span className="text-sm font-medium">{message}</span>
                    <button onClick={onClose} className="ml-auto text-ink-subtle hover:text-ink"><Icons.X /></button>
                </div>
            );
        }

        // Stat Card — Linear-inspired with subtle accent bar
        function StatCard({ label, value, icon, color, subtitle }) {
            const colorMap = {
                blue: { bg: 'bg-brand-50', text: 'text-brand-500', bar: 'bg-brand-500' },
                green: { bg: 'bg-emerald-50', text: 'text-emerald-600', bar: 'bg-emerald-500' },
                purple: { bg: 'bg-violet-50', text: 'text-violet-600', bar: 'bg-violet-500' },
                orange: { bg: 'bg-amber-50', text: 'text-amber-600', bar: 'bg-amber-500' },
            };
            const c = colorMap[color] || colorMap.blue;
            return (
                <div className="bg-white rounded-xl border border-hairline p-5 card-hover relative overflow-hidden">
                    <div className={`absolute top-0 left-0 w-full h-0.5 ${c.bar}`}></div>
                    <div className="flex items-start justify-between">
                        <div>
                            <p className="text-xs font-medium text-ink-subtle uppercase tracking-wider">{label}</p>
                            <p className="text-2xl font-bold text-ink mt-1.5 tracking-tight">{value}</p>
                            {subtitle && <p className="text-xs text-ink-subtle mt-1">{subtitle}</p>}
                        </div>
                        <div className={`w-10 h-10 rounded-lg ${c.bg} ${c.text} flex items-center justify-center`}>
                            {icon}
                        </div>
                    </div>
                </div>
            );
        }

        // Plan Badge — pill style
        function PlanBadge({ plan }) {
            const colors = {
                starter: 'bg-surface-3 text-ink-muted',
                pro: 'bg-brand-50 text-brand-600',
                enterprise: 'bg-violet-50 text-violet-600',
            };
            return <span className={`px-2 py-0.5 rounded text-[11px] font-semibold tracking-wide ${colors[plan] || colors.starter}`}>{plan?.toUpperCase()}</span>;
        }

        // Status Badge — dot + label
        function StatusBadge({ active }) {
            return active
                ? <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot"></span><span className="text-xs font-medium text-emerald-600">Active</span></span>
                : <span className="flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-red-400"></span><span className="text-xs font-medium text-red-500">Revoked</span></span>;
        }

        // Modal — glass overlay, refined
        function Modal({ open, onClose, title, children }) {
            if (!open) return null;
            return (
                <div className="fixed inset-0 z-40 flex items-center justify-center">
                    <div className="fixed inset-0 bg-black/40 backdrop-blur-sm" onClick={onClose}></div>
                    <div className="relative bg-white rounded-xl shadow-2xl w-full max-w-lg mx-4 fade-in-up max-h-[90vh] overflow-y-auto border border-hairline">
                        <div className="flex items-center justify-between px-6 py-4 border-b border-hairline">
                            <h3 className="text-sm font-semibold text-ink">{title}</h3>
                            <button onClick={onClose} className="text-ink-subtle hover:text-ink p-1 rounded-md hover:bg-surface-2 transition-colors"><Icons.X /></button>
                        </div>
                        <div className="p-6">{children}</div>
                    </div>
                </div>
            );
        }

        // Create License Form — consistent inputs
        function CreateLicenseForm({ onCreated, onClose }) {
            const [form, setForm] = useState({
                customer_name: '', customer_email: '', plan: 'starter',
                product: '', max_machines: 1, expires_at: '', notes: ''
            });
            const [loading, setLoading] = useState(false);
            const [createdKey, setCreatedKey] = useState(null);
            const [copied, setCopied] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                try {
                    const payload = { ...form, max_machines: parseInt(form.max_machines) };
                    if (!payload.expires_at) delete payload.expires_at;
                    if (!payload.notes) delete payload.notes;
                    const result = await api.post('/licenses', payload);
                    setCreatedKey(result.license_key);
                    onCreated();
                } catch (err) {
                    alert('Error: ' + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const copyKey = () => {
                navigator.clipboard.writeText(createdKey);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            if (createdKey) {
                return (
                    <div className="text-center py-2">
                        <div className="w-14 h-14 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg className="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M5 13l4 4L19 7" /></svg>
                        </div>
                        <h4 className="text-base font-semibold text-ink mb-1">License Created</h4>
                        <p className="text-sm text-ink-subtle mb-4">Copy and share with customer</p>
                        <div className="bg-ink rounded-lg p-4 flex items-center justify-between gap-3">
                            <code className="text-emerald-400 text-sm font-mono break-all text-left">{createdKey}</code>
                            <button onClick={copyKey} className="text-ink-subtle hover:text-white flex-shrink-0 transition-colors">
                                {copied ? <Icons.Check /> : <Icons.Copy />}
                            </button>
                        </div>
                        {copied && <p className="text-xs text-emerald-500 mt-2">Copied to clipboard</p>}
                        <button onClick={onClose} className="mt-5 px-4 py-2 bg-brand-500 text-white rounded-lg text-sm font-medium btn-primary">Done</button>
                    </div>
                );
            }

            const inputClass = "w-full px-3 py-2 border border-hairline rounded-lg text-sm input-focus focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none text-ink placeholder:text-ink-tertiary";

            return (
                <form onSubmit={handleSubmit} className="space-y-4">
                    <div className="grid grid-cols-2 gap-4">
                        <div>
                            <label className="block text-xs font-medium text-ink-muted mb-1.5">Customer Name *</label>
                            <input required value={form.customer_name} onChange={e => setForm({...form, customer_name: e.target.value})}
                                className={inputClass} placeholder="John Doe" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-ink-muted mb-1.5">Email *</label>
                            <input required type="email" value={form.customer_email} onChange={e => setForm({...form, customer_email: e.target.value})}
                                className={inputClass} placeholder="john@company.com" />
                        </div>
                    </div>
                    <div>
                        <label className="block text-xs font-medium text-ink-muted mb-1.5">Product / App *</label>
                        <select required value={form.product} onChange={e => setForm({...form, product: e.target.value})}
                            className={inputClass}>
                            <option value="">Select an app...</option>
                            <option value="ryasai-chatbot">ryasai-chatbot (Chatbot)</option>
                            <option value="ryasai-visia">ryasai-visia (Vision Analytics)</option>
                            <option value="d2t">d2t (D2T — Document to Text)</option>
                            <option value="peopledet">peopledet (PeopleDet)</option>
                        </select>
                        <p className="text-[11px] text-ink-tertiary mt-1">Must match the app's LICENSE_PRODUCT env var</p>
                    </div>
                    <div className="grid grid-cols-3 gap-4">
                        <div>
                            <label className="block text-xs font-medium text-ink-muted mb-1.5">Plan</label>
                            <select value={form.plan} onChange={e => setForm({...form, plan: e.target.value})}
                                className={inputClass}>
                                <option value="starter">Starter</option>
                                <option value="pro">Pro</option>
                                <option value="enterprise">Enterprise</option>
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-ink-muted mb-1.5">Max Machines</label>
                            <input type="number" min="1" max="100" value={form.max_machines} onChange={e => setForm({...form, max_machines: e.target.value})}
                                className={inputClass} />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-ink-muted mb-1.5">Expires At</label>
                            <input type="date" value={form.expires_at} onChange={e => setForm({...form, expires_at: e.target.value})}
                                className={inputClass} />

                    </div>
                    <div>
                        <label className="block text-xs font-medium text-ink-muted mb-1.5">Notes</label>

                        </button>
                    </div>
                </form>
            );
        }

        // License Detail Modal — refined
        function LicenseDetailModal({ license, open, onClose, onUpdate }) {
            const [detail, setDetail] = useState(null);

            useEffect(() => {
                if (open && license) {
                    setDetail(null);
                    api.get(`/licenses/${license.id}`).then(setDetail).catch(console.error);
                }
            }, [open, license]);

            const handleRevoke = async () => {
                if (!confirm('Revoke this license? Client will lose access immediately.')) return;
                await api.delete(`/licenses/${license.id}`);
                onUpdate();
                onClose();
            };

            const handleReactivate = async () => {
                await api.patch(`/licenses/${license.id}`, { is_active: true });
                onUpdate();
                onClose();
            };

            if (!detail) return (
                <Modal open={open} onClose={onClose} title="License Details">
                    <div className="flex items-center justify-center py-8"><Spinner size="w-5 h-5" color="text-brand-500" /></div>
                </Modal>
            );

            return (
                <Modal open={open} onClose={onClose} title="License Details">
                    <div className="space-y-5">
                        {/* Key */}
                        <div className="bg-surface-2 rounded-lg p-3 border border-hairline">
                            <p className="text-[10px] font-medium text-ink-subtle uppercase tracking-wider mb-1">License Key</p>
                            <div className="flex items-center gap-2">
                                <code className="text-sm font-mono text-ink break-all">{detail.license_key}</code>
                                <button onClick={() => navigator.clipboard.writeText(detail.license_key)} className="text-ink-subtle hover:text-brand-500 flex-shrink-0 transition-colors"><Icons.Copy /></button>
                            </div>
                        </div>

                        {/* Info grid */}
                        <div className="grid grid-cols-2 gap-x-4 gap-y-3">
                            {[
                                ['Customer', detail.customer_name],
                                ['Email', detail.customer_email],
                                ['Plan', null, <PlanBadge plan={detail.plan} />],
                                ['Status', null, <StatusBadge active={detail.is_active} />],
                                ['Max Machines', detail.max_machines],
                                ['Expires', detail.expires_at ? new Date(detail.expires_at).toLocaleDateString() : 'Lifetime'],
                                ['Created', detail.created_at ? new Date(detail.created_at).toLocaleDateString() : '-'],
                            ].map(([label, value, comp], i) => (
                                <div key={i} className="text-sm">
                                    <p className="text-[10px] font-medium text-ink-subtle uppercase tracking-wider mb-0.5">{label}</p>
                                    {comp || <p className="font-medium text-ink">{value}</p>}
                                </div>
                            ))}
                        </div>

                        {/* Machines */}
                        {detail.machines && detail.machines.length > 0 && (
                            <div>
                                <p className="text-[10px] font-medium text-ink-subtle uppercase tracking-wider mb-2">
                                    Activated Machines ({detail.machines.filter(m => m.is_active).length}/{detail.max_machines})
                                </p>
                                <div className="space-y-1.5">
                                    {detail.machines.map(m => (
                                        <div key={m.id} className="flex items-center justify-between bg-surface-2 rounded-lg px-3 py-2.5 border border-hairline">
                                            <div>
                                                <code className="text-xs font-mono text-ink-muted">{m.machine_id.substring(0, 20)}...</code>
                                                <p className="text-[11px] text-ink-subtle mt-0.5">Last seen: {m.last_seen ? new Date(m.last_seen).toLocaleString() : '-'}</p>
                                            </div>
                                            <StatusBadge active={m.is_active} />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Actions */}
                        <div className="flex justify-between pt-3 border-t border-hairline">
                            {detail.is_active ? (
                                <button onClick={handleRevoke} className="px-3 py-2 text-sm font-medium text-red-500 hover:bg-red-50 rounded-lg flex items-center gap-1.5 transition-colors">
                                    <Icons.Trash /> Revoke
                                </button>
                            ) : (
                                <button onClick={handleReactivate} className="px-3 py-2 text-sm font-medium text-emerald-600 hover:bg-emerald-50 rounded-lg flex items-center gap-1.5 transition-colors">
                                    <Icons.Check /> Reactivate
                                </button>
                            )}
                            <button onClick={onClose} className="px-4 py-2 text-sm font-medium text-ink-muted hover:bg-surface-2 rounded-lg transition-colors">Close</button>
                        </div>
                    </div>
                </Modal>
            );
        }

        // Licenses Page
        function LicensesPage() {
            const [licenses, setLicenses] = useState([]);

            const [page, setPage] = useState(1);
            const [showCreate, setShowCreate] = useState(false);
            const [selectedLicense, setSelectedLicense] = useState(null);
            const [filter, setFilter] = useState('all');
            const [search, setSearch] = useState('');

            const loadLicenses = useCallback(() => {
                const activeOnly = filter === 'active';
                api.get(`/licenses?page=${page}&per_page=15&active_only=${activeOnly}`).then(d => {
                    setLicenses(d.data || []);
                    setTotal(d.total || 0);

            // Client-side search filter

                    l.customer_name?.toLowerCase().includes(search.toLowerCase()) ||
                    l.customer_email?.toLowerCase().includes(search.toLowerCase()) ||
                    l.license_key?.toLowerCase().includes(search.toLowerCase())

                        </div>
                        <select value={filter} onChange={e => { setFilter(e.target.value); setPage(1); }}
                            className="px-3 py-2 border border-hairline rounded-lg text-sm text-ink-muted focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none">
                            <option value="all">All Status</option>
                            <option value="active">Active Only</option>

                    {/* Table */}
                    <div className="bg-white rounded-xl border border-hairline overflow-hidden">

                                <tr className="text-left text-ink-subtle text-xs font-medium uppercase tracking-wider">

        // Validation Logs Page — auto-refresh, better result badges
        function LogsPage() {
            const [logs, setLogs] = useState([]);
            const [loading, setLoading] = useState(true);
            const [autoRefresh, setAutoRefresh] = useState(false);

            const fetchLogs = useCallback(() => {
                return api.get('/validation-logs?limit=50')
                    .then(setLogs)
                    .catch(() => setLogs([]))
                    .finally(() => setLoading(false));
            }, []);

            useEffect(() => { fetchLogs(); }, []);

            // Auto-refresh every 10s
            useEffect(() => {
                if (!autoRefresh) return;
                const interval = setInterval(fetchLogs, 10000);
                return () => clearInterval(interval);
            }, [autoRefresh, fetchLogs]);

            const resultStyles = {
                valid: { bg: 'bg-emerald-50 text-emerald-700 border-emerald-200', dot: 'bg-emerald-500' },
                invalid: { bg: 'bg-red-50 text-red-700 border-red-200', dot: 'bg-red-500' },
                expired: { bg: 'bg-amber-50 text-amber-700 border-amber-200', dot: 'bg-amber-500' },
                machine_limit: { bg: 'bg-violet-50 text-violet-700 border-violet-200', dot: 'bg-violet-500' },
                inactive: { bg: 'bg-surface-3 text-ink-muted border-hairline', dot: 'bg-gray-400' },
                wrong_product: { bg: 'bg-orange-50 text-orange-700 border-orange-200', dot: 'bg-orange-500' },
            };

            const validCount = logs.filter(l => l.result === 'valid').length;
            const failCount = logs.filter(l => l.result !== 'valid').length;

            return (
                <div className="fade-in-up">
                    <div className="flex items-center justify-between mb-6">
                        <div>
                            <h2 className="text-xl font-bold text-ink tracking-tight">Validation Logs</h2>
                            <p className="text-sm text-ink-subtle mt-0.5">
                                {logs.length} entries
                                {logs.length > 0 && <span className="ml-2 text-ink-tertiary">({validCount} valid, {failCount} failed)</span>}
                            </p>
                        </div>
                        <div className="flex items-center gap-2">
                            <label className="flex items-center gap-2 text-xs text-ink-subtle cursor-pointer select-none">
                                <input type="checkbox" checked={autoRefresh} onChange={e => setAutoRefresh(e.target.checked)}
                                    className="rounded border-hairline text-brand-500 focus:ring-brand-500/20" />
                                Auto-refresh
                                {autoRefresh && <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 pulse-dot"></span>}
                            </label>
                            <button onClick={fetchLogs} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-ink-muted hover:bg-surface-2 rounded-md border border-hairline transition-colors">
                                <Icons.Refresh /> Refresh
                            </button>
                        </div>
                    </div>

                    <div className="bg-white rounded-xl border border-hairline overflow-hidden">
                        <table className="w-full text-sm">
                            <thead className="bg-surface-2 border-b border-hairline">
                                <tr className="text-left text-ink-subtle text-xs font-medium uppercase tracking-wider">
                                    <th className="px-5 py-3">Time</th>
                                    <th className="px-5 py-3">License Key</th>
                                    <th className="px-5 py-3">Machine ID</th>
                                    <th className="px-5 py-3">Result</th>
                                    <th className="px-5 py-3">IP Address</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-hairline">
                                {logs.map((log, i) => {
                                    const style = resultStyles[log.result] || resultStyles.inactive;
                                    return (
                                        <tr key={i} className="table-row-hover hover:bg-surface-0">
                                            <td className="px-5 py-3 text-xs text-ink-muted whitespace-nowrap">{log.timestamp ? new Date(log.timestamp).toLocaleString() : '-'}</td>
                                            <td className="px-5 py-3"><code className="text-xs font-mono text-ink-muted bg-surface-2 px-1.5 py-0.5 rounded">{log.license_key?.substring(0, 16)}...</code></td>
                                            <td className="px-5 py-3"><code className="text-xs font-mono text-ink-subtle">{log.machine_id?.substring(0, 14)}...</code></td>
                                            <td className="px-5 py-3">
                                                <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px] font-semibold border ${style.bg}`}>
                                                    <span className={`w-1.5 h-1.5 rounded-full ${style.dot}`}></span>
                                                    {log.result?.replace('_', ' ')}
                                                </span>
                                            </td>
                                            <td className="px-5 py-3 text-xs text-ink-subtle font-mono">{log.ip_address || '-'}</td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                        {loading && (
                            <div className="py-12 flex items-center justify-center">
                                <Spinner size="w-5 h-5" color="text-brand-500" />
                            </div>
                        )}
                        {!loading && logs.length === 0 && (
                            <div className="py-12 text-center">
                                <div className="w-12 h-12 rounded-full bg-surface-2 flex items-center justify-center mx-auto mb-3 text-ink-subtle">
                                    <Icons.Activity />
                                </div>
                                <p className="text-sm text-ink-subtle">No validation logs yet</p>
                                <p className="text-xs text-ink-tertiary mt-1">Logs appear when clients validate licenses</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main App (with auth gate)
        function AdminPanel({ user, onLogout }) {
            const [page, setPage] = useState('dashboard');
            const [toast, setToast] = useState(null);

            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: <Icons.Dashboard /> },
                { id: 'licenses', label: 'Licenses', icon: <Icons.Key /> },
                { id: 'logs', label: 'Validation Logs', icon: <Icons.Activity /> },
            ];

            return (
                <div className="flex h-screen bg-surface-0">
                    {/* Sidebar — Linear-inspired light surface */}
                    <aside className="w-60 bg-white border-r border-hairline flex flex-col">
                        <div className="px-5 py-5 border-b border-hairline">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-gradient-to-br from-brand-500 to-brand-700 rounded-lg flex items-center justify-center shadow-sm">
                                    <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                                </div>
                                <div>
                                    <h1 className="text-sm font-semibold text-ink tracking-tight">License Manager</h1>
                                    <p className="text-xs text-ink-subtle">Admin Panel</p>
                                </div>
                            </div>
                        </div>

                        <nav className="flex-1 px-3 py-4 space-y-0.5">
                            {navItems.map(item => (
                                <button key={item.id} onClick={() => setPage(item.id)}
                                    className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-md text-sm font-medium transition-all duration-150 ${
                                        page === item.id
                                            ? 'bg-brand-50 text-brand-600 shadow-sm'
                                            : 'text-ink-muted hover:bg-surface-2 hover:text-ink'
                                    }`}>
                                    <span className={page === item.id ? 'text-brand-500' : ''}>{item.icon}</span>
                                    {item.label}
                                </button>
                            ))}
                        </nav>

                        <div className="px-4 py-4 border-t border-hairline">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center gap-2.5 min-w-0">
                                    <div className="w-7 h-7 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-xs font-semibold flex-shrink-0">
                                        {(user?.email || 'A')[0].toUpperCase()}
                                    </div>
                                    <div className="min-w-0">
                                        <p className="text-xs text-ink truncate">{user?.email || 'Admin'}</p>
                                        <div className="flex items-center gap-1.5 mt-0.5">
                                            <div className="w-1.5 h-1.5 rounded-full bg-green-500 pulse-dot"></div>
                                            <span className="text-[10px] text-ink-subtle">Online</span>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={onLogout} title="Sign out"
                                    className="text-ink-subtle hover:text-red-500 transition-colors p-1.5 rounded-md hover:bg-red-50">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.75} d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </aside>

                    {/* Main content */}
                    <main className="flex-1 overflow-auto bg-surface-0">
                        <div className="p-8 max-w-7xl mx-auto">
                            {page === 'dashboard' && <DashboardPage />}
                            {page === 'licenses' && <LicensesPage />}
                            {page === 'logs' && <LogsPage />}
                        </div>
                    </main>

                    {/* Toast */}
                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}
                </div>
            );
        }

        function App() {
            const [authenticated, setAuthenticated] = useState(!!TokenStore.get());
            const [user, setUser] = useState(null);
            const [verifying, setVerifying] = useState(!!TokenStore.get());

            // Verify token on mount
            useEffect(() => {
                const token = TokenStore.get();
                if (token) {
                    api.get('/stats').then(() => {
                        setAuthenticated(true);
                    }).catch(() => {
                        TokenStore.clear();
                        setAuthenticated(false);
                    }).finally(() => setVerifying(false));
                } else {
                    setVerifying(false);
                }
            }, []);

            const handleLogin = (data) => {
                setUser({ email: data.email });
                setAuthenticated(true);
            };

            const handleLogout = () => {
                TokenStore.clear();
                setAuthenticated(false);
                setUser(null);
            };

            // Loading state while verifying token
            if (verifying) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-surface-0">
                        <div className="text-center fade-in">
                            <Spinner size="w-6 h-6" color="text-brand-500" />
                            <p className="text-xs text-ink-subtle mt-3">Verifying session...</p>
                        </div>
                    </div>
                );
            }

            if (!authenticated) {
                return <LoginPage onLogin={handleLogin} />;
            }

            return <AdminPanel user={user} onLogout={handleLogout} />;
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
